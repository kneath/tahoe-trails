# Render Blueprint: deploys the app as a static site.
# The data in public/data/ is committed, so builds never call out to data sources.
services:
  - type: web
    runtime: static
    name: tahoe-trails
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      # Vite fingerprints everything under assets/, so it can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Data files keep their names across rebuilds; let browsers revalidate
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
