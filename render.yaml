# Render Blueprint: deploys the app as a static site.
# The data in public/data/ is committed, so builds never call out to data sources.
#
# The live site (trails-fun.warpspire.com) was created directly rather than from this
# Blueprint, so Render doesn't read this file. Its settings and headers were entered in
# the dashboard to match what's here; keep the two in sync.
services:
  - type: web
    runtime: static
    name: tahoe-trails
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    domains:
      - trails-fun.warpspire.com
    headers:
      # Vite fingerprints everything under assets/, so it can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Data files keep their names across rebuilds: cache for an hour, then refresh in the background
      - path: /data/*
        name: Cache-Control
        value: public, max-age=3600, stale-while-revalidate=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
